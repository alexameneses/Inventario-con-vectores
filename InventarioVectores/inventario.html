<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
    <h1>Inventario con vectores</h1>
    <h2>García Meneses Alexa Ximena</h2>
    <script>
    class Inventario {
    constructor() {
        this.productos = [];
    }
    agregar(producto){
        this.productos.push(producto);
    }
    agregarInicio(producto){
        for(let i = this.productos.length; i>0; i--)
            this.productos[i] = this.productos[i-1];
        this.productos[0] = producto;
    }
    extraerPrimero(){
        let primero = this.productos[0];
       // this.productos[0] = null;
        for(let i = 0; i < this.productos.length-1; i++ )
            this.productos[i]=this.productos[i+1];
        this.productos.pop();
        return primero;
    }
    
    eliminar(codigo){
        for(let i=0; i < this.productos.length;i++){
            if(this.productos[i].codigo== codigo){
                for(let j=i; j < this.productos.length - 1; j++)
                    this.productos[j] = this.productos[j+1];
                    this.productos.pop();
                    return;
            }
        }
    }
    
    listar(){
        let lista = "";
        for(let i = 0; i < this.productos.length; i++)
            lista += this.productos[i].info() + " ";
        return lista;
    }
    
    buscar(codigo){
        for(let i=0; i < this.productos.length;i++)
            if(this.productos[i].codigo== codigo)
                return this.productos[i];
        return null;
    }  

}
class Producto {
    constructor(codigo, nombre, cantidad, costo){
        this.codigo = codigo;
        this.nombre = nombre;
        this.cantidad = cantidad;
        this.costo = costo;
    }
    info(){
        let info = this.codigo + " es un " + this.nombre + " en existencia hay " + this.cantidad + " y  cuesta " + this.costo;
        return info;
    }
}


let inventario=new Inventario();
let nuevo=new Producto(1,"Lapiz",100,10); //hay 100 y cuestan 10
inventario.agregar(nuevo);
nuevo=new Producto(2,"Borrador",200,20); 
inventario.agregar(nuevo);
nuevo=new Producto(3,"Cuaderno",300,30);
inventario.agregar(nuevo);
nuevo=new Producto(4,"Clips",20,10); 
inventario.agregarInicio(nuevo);
nuevo=new Producto(5,"Sacapuntas",500,50); 
inventario.agregar(nuevo);

console.log(inventario.listar())

inventario.eliminar(3);

console.log(inventario.listar())

let res=inventario.buscar(10);
if (res==null)
  console.log("No existe");
else
  console.log("si existe");

res=inventario.buscar(4);
if (res==null)
  console.log("No existe");
else
  console.log(res.info());

res=inventario.extraerPrimero();
console.log("el primero es ");
console.log(res.info());
console.log(inventario.listar());</script>
